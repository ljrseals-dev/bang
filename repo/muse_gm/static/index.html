<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUSE-GM</title>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#dcdcd4;--acc:#7a3b1d;--ok:#1f6b3a}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecece6;--mut:#9a9a92;--card:#1f1f1d;--line:#34342f;--acc:#e0a27a;--ok:#6fcf97}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{letter-spacing:.04em}#stage{color:var(--acc);font-size:13px}#appr{font-size:12px;color:var(--ok);flex:1;min-width:200px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}button:disabled{opacity:.5;cursor:default}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:820px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;border-color:var(--acc)}.system{color:var(--mut);font-size:13px;border-style:dashed}
.surf{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px}
.surf table{border-collapse:collapse;font-size:13px;width:100%}.surf th,.surf td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.surf h4{margin:2px 4px 8px;font-size:13px;color:var(--mut)}.cmp{color:var(--mut);font-size:12px}
a{color:var(--acc)}form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
textarea{flex:1;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;min-height:44px;max-height:200px}
</style></head><body>
<header><b>MUSE-GM</b><span id="stage">...</span><span id="appr"></span><button id="reset" type="button">New session</button></header>
<div id="log" aria-live="polite"></div>
<form id="f"><textarea id="t" placeholder="Tell me the medium (manga or screenplay), node, era, and target effect, or ask for a ranking." required></textarea><button id="send">Send</button></form>
<script>
const K="muse_sid";let sid=localStorage.getItem(K);
if(!sid){sid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);localStorage.setItem(K,sid)}
const $=s=>document.querySelector(s),log=$("#log");
const H={"Content-Type":"application/json","X-MUSE":"1"};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function render(st){
  $("#stage").textContent=st.stage;
  const a=st.approved;$("#appr").textContent=a?("Approved "+a.row_id+" ("+a.effect+", "+a.score+"): "+Object.values(a.config).slice(0,7).join(" | ")):"No configuration approved yet";
  log.textContent="";
  for(const it of st.ui){
    if(it.type==="surface"){
      const w=el("div","surf");w.append(el("h4",null,"Surface "+it.id+" - profile "+it.profile+" - rubric judgments, not measurements"));
      const t=el("table"),hd=el("tr");for(const h of ["id","score","configuration","components",""])hd.append(el("th",null,h));t.append(hd);
      for(const r of it.rows){
        const tr=el("tr");tr.append(el("td",null,r.row_id),el("td",null,r.score.toFixed(4)));
        tr.append(el("td",null,Object.entries(r.config).filter(([k])=>k!=="effect").map(e=>e[1]).join(" | ")+"  ["+r.effect+"]"));
        tr.append(el("td","cmp",Object.entries(r.components).map(([k,v])=>k.split("_")[0].slice(0,5)+" "+v.toFixed(2)).join("  ")));
        const b=el("button",null,st.approved&&st.approved.row_id===r.row_id?"Approved":"Approve");b.disabled=!!(st.approved&&st.approved.row_id===r.row_id);
        b.onclick=()=>post("/api/approve",{row_id:r.row_id});const td=el("td");td.append(b);tr.append(td);t.append(tr)}
      w.append(t);log.append(w)}
    else if(it.type==="artifact"){const d=el("div","m system");d.append("Saved "+it.kind+": ");
      const a=el("a",null,it.file);a.href="/api/artifact?session="+encodeURIComponent(sid)+"&name="+encodeURIComponent(it.file);a.target="_blank";d.append(a);log.append(d)}
    else log.append(el("div","m "+it.type,it.text))}
  log.scrollTop=log.scrollHeight}
async function post(path,body){
  $("#send").disabled=true;
  try{const r=await fetch(path,{method:"POST",headers:H,body:JSON.stringify({session:sid,...body})});const j=await r.json();
    if(j.ui)render(j);else log.append(el("div","m system","Error: "+(j.error||r.status)))}
  catch(e){log.append(el("div","m system","Network error: "+e))}
  $("#send").disabled=false}
$("#f").onsubmit=e=>{e.preventDefault();const v=$("#t").value.trim();if(!v)return;$("#t").value="";
  log.append(el("div","m user",v));log.append(el("div","m system","thinking..."));post("/api/chat",{message:v})};
$("#t").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#f").requestSubmit()}});
$("#reset").onclick=async()=>{await fetch("/api/reset",{method:"POST",headers:H,body:JSON.stringify({session:sid})});
  localStorage.removeItem(K);location.reload()};
fetch("/api/state?session="+encodeURIComponent(sid)).then(r=>r.json()).then(render);
</script></body></html>
