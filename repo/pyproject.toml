[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-gm"
version = "0.1.0"
description = "Exhaustive decision-surface engine and chat app for Black-diaspora gangster manga and film scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
app = ["anthropic>=0.40"]

[project.scripts]
muse-gm = "muse_gm.engine:main"
muse-gm-app = "muse_gm.app:main"

[tool.setuptools]
packages = ["muse_gm"]

[tool.setuptools.package-data]
muse_gm = ["data/*.json", "static/*.html", "prompts/*.md"]
